[project]
name = "tgagent"
version = "0.1.0"
description = "MCP server on top of a personal Telegram account: MTProto (Telethon), a session-owning daemon, 79 tools"
readme = "README.md"
# 3.11, not 3.13: the only thing holding the bar is `datetime.UTC` (the alias
# appeared in 3.11). There is neither syntax nor functions from 3.12/3.13 in the
# code, and the whole scaffolding — linter, tests, selfcheck — is green on 3.11.
# Below 3.11 we would have to change code for the sake of a version that is going
# out of support anyway.
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Roman Akramov" }]
keywords = [
    "telegram",
    "mcp",
    "model-context-protocol",
    "telethon",
    "mtproto",
    "claude",
    "claude-code",
    "agent",
]
# The licence is declared with the `license` field per PEP 639, so the
# `License :: OSI Approved` classifier is deliberately absent here: it is
# forbidden together with an SPDX string.
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    # Two, and in this order: the code, the documentation and everything the model
    # reads are English; what the owner reads is either, chosen by TG_LANG.
    "Natural Language :: English",
    "Natural Language :: Russian",
    # The daemon talks to the MCP server over a unix socket, so Windows is not claimed.
    "Operating System :: POSIX",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Utilities",
]
dependencies = [
    "aiohttp>=3.14.3",
    "mcp>=2.0.0",
    "python-dotenv>=1.2.2",
    "telethon==1.44.0",
]

[project.optional-dependencies]
# Local audio transcription. mlx — for Apple Silicon, faster-whisper — everywhere.
local-whisper = [
    "mlx-whisper>=0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "faster-whisper>=1.2.1",
]

[dependency-groups]
# Development only: does not go into the image or into the package install.
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
    "ruff>=0.16",
]

[project.urls]
Homepage = "https://github.com/draiqw/tg-mcp"
Repository = "https://github.com/draiqw/tg-mcp"
Documentation = "https://github.com/draiqw/tg-mcp/blob/main/docs/tools.md"
Issues = "https://github.com/draiqw/tg-mcp/issues"

[project.scripts]
tg = "tgagent.cli:main"
tg-mcp = "tgagent.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tgagent"]
# The subagents and the autostart templates are not documentation but data that
# `tg init`/`tg doctor` reads on a live machine. In a clone they sit at the root;
# when installed as a package there is no root, so the same files are placed
# inside the package, which is where install.agents_src_dir() looks for them.
# Without this, doctor from a wheel would fail on a missing file.
force-include = { "agents" = "tgagent/agents", "com.tgagent.daemon.plist" = "tgagent/autostart/com.tgagent.daemon.plist", "tgagent.service" = "tgagent/autostart/tgagent.service" }

[tool.ruff]
# The code is typed to roughly 90 columns: the 99th percentile of line length is
# 91 characters. The limit is set with room to spare at 100, so that a dozen long
# signatures and string literals do not have to be broken up for the sake of
# breaking them, but everything longer than a hundred is genuinely unreadable and
# gets fixed.
line-length = 100
target-version = "py311"
extend-exclude = ["data"]

# `ruff format` is deliberately not accepted as a mandatory step. Its single big
# complaint about this code is the trailing comments aligned into a column in the
# tables of rules, of the dispatcher and of the settings: it squeezes them down to
# one space and rewrites about 1900 lines out of 12500 that way. The readability
# of the tables drops, and the change history drowns in noise, so the formatter is
# only advisory here (`uvx ruff format --diff`), and the norm is the output of
# `ruff check`.

[tool.ruff.lint]
# The set is assembled for this project: we catch errors and dangerous
# constructs, but do not impose a style. What is deliberately absent here is in
# the comment below the list: it is as much a part of the decision as what is
# enabled.
select = [
    "E",      # pycodestyle: errors — comparisons to None, bare except, line length
    "W",      # pycodestyle: trailing whitespace and other invisible junk in diffs
    "F",      # pyflakes: unused, undeclared, broken f-strings
    "I",      # import order and grouping
    "B",      # flake8-bugbear: typical traps such as a mutable default argument
    "UP",     # pyupgrade: syntax per the declared requires-python = 3.11
    "ASYNC",  # blocking calls inside coroutines — a direct threat to the daemon's one loop
    "RUF002", # a Cyrillic look-alike in a docstring — those are English here
    "RUF003", # the same in a comment
    "RUF100", # a noqa that no longer suppresses anything
]

# Deliberately NOT enabled (listed so that "turn everything on" does not look
# like an improvement later):
#   BLE001, S110, S112, TRY300/TRY400 — "do not catch a broad exception",
#     "except: pass". Here that is by design, not by sloppiness: the watcher, the
#     event handlers and the daemon's background tasks have to survive any error
#     on a single message, otherwise the session owner dies as a whole and
#     Telegram is left without a client. The places where an exception really is
#     swallowed for nothing are found by eye, not by a rule with a hundred false
#     positives.
#   RUF001 — "ambiguous Unicode characters" in strings. tgagent/i18n.py holds the
#     Russian half of the message catalog, which is two hundred deliberate hits,
#     and a handful more are the aliases the owner types (see INDEX_SELF). Its
#     siblings RUF002/RUF003, which guard docstrings and comments, ARE enabled:
#     those are English everywhere, and a Cyrillic "с" that wandered into one is
#     exactly the invisible typo the rule exists for.
#   SIM, PERF, ANN, D — matters of taste and rewriting working code; the cleanup
#     is meant as scaffolding, not as a refactoring.
ignore = [
    # ASYNC240 demands trio.Path/anyio.Path instead of pathlib inside coroutines.
    # Here it is asyncio, where there is no async Path at all, and the filesystem
    # calls are mkdir, stat, reading a small json. The rule describes someone
    # else's framework.
    "ASYNC240",
    # ASYNC109 forbids a timeout parameter on a coroutine, suggesting the timeout
    # be set from the outside. Here timeout is part of the daemon's RPC protocol
    # and of the MCP tool signatures: the caller lives in another process and
    # cannot set it from the outside.
    "ASYNC109",
]

[tool.ruff.lint.isort]
known-first-party = ["tgagent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# There are not many async tests here, but there are some in every file about the
# daemon; auto saves putting a marker on each of them.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:tgagent.*"]
