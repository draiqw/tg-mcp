[project]
name = "tgagent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.14.3",
    "mcp>=2.0.0",
    "python-dotenv>=1.2.2",
    "telethon==1.44.0",
]

[project.optional-dependencies]
# Local audio transcription. mlx — for Apple Silicon, faster-whisper — everywhere.
local-whisper = [
    "mlx-whisper>=0.4.3; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "faster-whisper>=1.2.1",
]

[project.scripts]
tg = "tgagent.cli:main"
tg-mcp = "tgagent.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tgagent"]
